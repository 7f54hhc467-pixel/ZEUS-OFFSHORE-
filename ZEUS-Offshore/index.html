<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ZEUS Offshore</title>
<meta name="theme-color" content="#0f2440">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ZEUS Offshore">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root{
  --bg:#f4f6f9; --panel:#ffffff; --text:#14202e; --muted:#5f6f82; --line:#dfe5ec;
  --brand:#0f2440; --brand2:#1d4f8f; --gold:#d4a62a; --gold-soft:#fbf3dc;
  --ok:#1f8a4c; --ok-soft:#e3f4ea; --warn:#b26b00; --warn-soft:#fff1d6;
  --bad:#c0392b; --bad-soft:#fde5e2; --info-soft:#e6eefa;
  --radius:12px; --shadow:0 1px 3px rgba(15,36,64,.08),0 4px 14px rgba(15,36,64,.05);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0d141d; --panel:#16202c; --text:#e7edf4; --muted:#93a3b5; --line:#263446;
    --brand:#0a1828; --brand2:#5b93d6; --gold:#e3b843; --gold-soft:#3a3020;
    --ok:#4cc483; --ok-soft:#173527; --warn:#f0a940; --warn-soft:#3b2c14;
    --bad:#ff7a6b; --bad-soft:#3d1d1a; --info-soft:#1b2a3f;
    --shadow:0 1px 3px rgba(0,0,0,.4);
  }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand2)}
[hidden]{display:none!important}

/* layout */
#app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
#nav{background:var(--brand);color:#fff;padding:calc(18px + env(safe-area-inset-top)) 12px 18px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.logo{display:flex;align-items:center;gap:10px;padding:4px 10px 18px;font-weight:800;letter-spacing:.5px;font-size:18px}
.logo .bolt{width:34px;height:34px;border-radius:9px;background:var(--gold);color:var(--brand);display:grid;place-items:center;font-size:20px}
.logo small{display:block;font-weight:500;font-size:11px;opacity:.65;letter-spacing:1.5px}
#nav a{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:10px;color:#dbe5f1;text-decoration:none;font-weight:550}
#nav a:hover{background:rgba(255,255,255,.07)}
#nav a.active{background:rgba(255,255,255,.13);color:#fff}
#nav a .ic{width:22px;text-align:center;font-size:17px}
#nav .spacer{flex:1}
#nav .lockbtn{background:none;border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:10px;padding:9px;cursor:pointer}
.badge-n{margin-left:auto;background:var(--bad);color:#fff;border-radius:20px;font-size:11px;padding:1px 7px;font-weight:700}
main{padding:28px 32px 60px;max-width:1150px;width:100%}
@media (max-width:820px){
  #app{grid-template-columns:1fr}
  #nav{position:fixed;bottom:0;top:auto;left:0;right:0;height:auto;flex-direction:row;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:20;gap:0}
  #nav .logo,#nav .spacer{display:none}
  #nav a{flex-direction:column;gap:2px;font-size:11px;padding:6px 4px;flex:1;text-align:center;position:relative}
  #nav a .badge-n{position:absolute;top:0;right:18%;margin:0}
  #nav .lockbtn{font-size:11px;padding:4px 8px;border:none}
  main{padding:calc(16px + env(safe-area-inset-top)) 16px 110px}
}

/* generic */
h1{font-size:26px;margin:0 0 4px}
h2{font-size:18px;margin:0 0 12px}
h3{font-size:15px;margin:0 0 8px}
.sub{color:var(--muted);margin:0 0 20px}
.head{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.head .grow{flex:1;min-width:200px}
.crumb{font-size:13px;color:var(--muted);margin-bottom:6px}
.crumb a{text-decoration:none}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);margin-bottom:16px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.stat{padding:16px 18px}
.stat .n{font-size:30px;font-weight:800;line-height:1.1}
.stat .l{color:var(--muted);font-size:13px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:600;text-decoration:none;color:var(--text);white-space:nowrap;min-height:40px}
.btn:hover{border-color:var(--brand2)}
.btn.primary{background:var(--brand2);border-color:var(--brand2);color:#fff}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#1b1404}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn.small{padding:5px 10px;min-height:32px;font-size:13px}
.btn.big{padding:14px 20px;font-size:16px}
.btn.ghost{background:none;border-color:transparent}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}
.item:last-child{border-bottom:none}
a.item:hover{background:var(--bg)}
.item .main{flex:1;min-width:0}
.item .t{font-weight:600}
.item .d{color:var(--muted);font-size:13px}
.empty{color:var(--muted);padding:16px 4px;text-align:center}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:20px;background:var(--info-soft);color:var(--brand2);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.gold{background:var(--gold-soft);color:var(--warn)}
.pill.muted{background:var(--bg);color:var(--muted)}
.tag{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.4px;padding:2px 7px;border-radius:6px;margin-right:4px;text-transform:uppercase}
.tag.ap{background:#efe3ff;color:#6b2fb5}
.tag.tr{background:#dff3ff;color:#0b6aa2}
.tag.ce{background:var(--gold-soft);color:var(--warn)}
.tag.rq{background:var(--bad-soft);color:var(--bad)}
@media (prefers-color-scheme: dark){.tag.ap{background:#2e2142;color:#c9a4ff}.tag.tr{background:#14304a;color:#79c6ff}}
.progress{height:8px;background:var(--line);border-radius:10px;overflow:hidden}
.progress>div{height:100%;background:var(--ok);border-radius:10px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs a{padding:10px 14px;text-decoration:none;color:var(--muted);font-weight:600;border-bottom:3px solid transparent;white-space:nowrap}
.tabs a.active{color:var(--text);border-color:var(--gold)}
.search{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.muted{color:var(--muted)}
.small{font-size:13px}
.right{margin-left:auto}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:none;background:var(--panel);padding:6px 10px;cursor:pointer;font-size:13px;font-weight:600;color:var(--muted);border-right:1px solid var(--line)}
.seg button:last-child{border-right:none}
.seg button.on.s-bad{background:var(--bad);color:#fff}
.seg button.on.s-warn{background:var(--warn);color:#fff}
.seg button.on.s-ok{background:var(--ok);color:#fff}
.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 12px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;word-break:break-word}

/* steps */
.steps{list-style:none;margin:0;padding:0}
.step{display:flex;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}
.step:last-child{border-bottom:none}
.step .num{flex:0 0 34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:var(--bg);color:var(--muted);border:2px solid var(--line)}
.step.done .num{background:var(--ok);color:#fff;border-color:var(--ok)}
.step.current{background:var(--gold-soft);margin:0 -18px;padding:16px 18px;border-radius:10px;border-bottom:none}
.step.current .num{background:var(--gold);border-color:var(--gold);color:#1b1404}
.step .body{flex:1}
.step .t{font-weight:650}
.step.done .t{color:var(--muted)}
.step .i{color:var(--muted);font-size:13px;margin-top:2px}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.cal .dh{background:var(--bg);padding:6px;text-align:center;font-size:12px;font-weight:700;color:var(--muted)}
.cal .day{background:var(--panel);min-height:96px;padding:5px;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.cal .day.out{opacity:.4}
.cal .day.today .dn{background:var(--brand2);color:#fff;border-radius:50%}
.cal .day.sel{outline:2px solid var(--gold);outline-offset:-2px}
.cal .dn{font-size:12px;font-weight:700;width:22px;height:22px;display:grid;place-items:center}
.cal .ev{font-size:11px;padding:1px 5px;border-radius:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--info-soft);color:var(--brand2)}
.cal .ev.pay{background:var(--warn-soft);color:var(--warn)}
.cal .ev.dl{background:var(--bad-soft);color:var(--bad)}
.cal .ev.done{background:var(--ok-soft);color:var(--ok);text-decoration:line-through}
@media (max-width:820px){.cal .day{min-height:58px}.cal .ev{font-size:0;height:6px;padding:0}}

/* forms & modal */
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.field label{font-weight:600;font-size:13px}
.field .hint{font-size:12px;color:var(--muted)}
.field input:not([type=checkbox]),.field select,.field textarea{padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:var(--panel);width:100%}
.field textarea{min-height:80px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brand2);outline-offset:0;border-color:transparent}
.check{display:flex;align-items:center;gap:8px;font-weight:500;cursor:pointer}
.check input{width:20px;height:20px}
.req::after{content:" *";color:var(--bad)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
@media (max-width:560px){.f2{grid-template-columns:1fr}.kv{grid-template-columns:1fr}.kv dt{margin-top:6px}}
#modal-root .back{position:fixed;inset:0;background:rgba(8,16,28,.55);display:grid;place-items:center;z-index:50;padding:16px}
#modal-root .modal{background:var(--panel);border-radius:16px;width:100%;max-width:560px;max-height:calc(100vh - 32px);overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
#modal-root .modal.wide{max-width:820px}
#modal-root .mh{padding:18px 20px 0;display:flex;align-items:center}
#modal-root .mh h2{margin:0;flex:1}
#modal-root .mb{padding:16px 20px}
#modal-root .mf{padding:0 20px 18px;display:flex;gap:8px;justify-content:flex-end}
#toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:var(--brand);color:#fff;padding:11px 18px;border-radius:10px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60}
#toast.show{opacity:1}
@media (max-width:820px){#toast{bottom:100px}}

/* lock */
#lock{position:fixed;inset:0;background:linear-gradient(160deg,#0f2440,#1d4f8f);display:grid;place-items:center;z-index:100;padding:20px}
#lock .box{background:var(--panel);color:var(--text);border-radius:18px;padding:30px;width:100%;max-width:380px;box-shadow:0 30px 80px rgba(0,0,0,.35);text-align:center}
#lock .bolt{width:64px;height:64px;border-radius:16px;background:var(--gold);color:#0f2440;display:grid;place-items:center;font-size:36px;margin:0 auto 12px}
#lock h1{font-size:24px}
#lock input{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:10px;margin-top:10px;font-size:17px;background:var(--panel);text-align:center}
#lock .btn{width:100%;justify-content:center;margin-top:14px}
#lock .err{color:var(--bad);font-weight:600;min-height:22px;margin-top:8px}
.note{background:var(--info-soft);border-radius:10px;padding:12px 14px;font-size:14px;margin-bottom:14px}
.note.warn{background:var(--warn-soft)}
.note.bad{background:var(--bad-soft)}
.editor-item{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px}
.editor-item .row input[type=text]{flex:1;min-width:180px}
.editor-item input[type=text],.editor-item textarea,.editor-item select,.editor-item input[type=number]{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.editor-item textarea{width:100%;margin-top:6px;min-height:44px}
</style>
</head>
<body>
<div id="lock"></div>
<div id="app" hidden>
  <nav id="nav">
    <div class="logo"><div class="bolt">⚡</div><div>ZEUS<small>OFFSHORE</small></div></div>
    <a href="#/" data-nav="dash"><span class="ic">🏠</span>Přehled</a>
    <a href="#/klienti" data-nav="clients"><span class="ic">👥</span>Klienti</a>
    <a href="#/kalendar" data-nav="cal"><span class="ic">📅</span>Kalendář<span class="badge-n" id="dl-badge" hidden></span></a>
    <a href="#/platby" data-nav="pay"><span class="ic">💳</span>Platby<span class="badge-n" id="pay-badge" hidden></span></a>
    <a href="#/nastaveni" data-nav="set"><span class="ic">⚙️</span>Nastavení</a>
    <div class="spacer"></div>
    <button class="lockbtn" data-act="lock">🔒 Zamknout</button>
  </nav>
  <main id="main"></main>
</div>
<div id="modal-root"></div>
<div id="toast"></div>

<script>
'use strict';
/* =========================================================
   ZEUS Offshore – offline evidence klientů a firem
   Data jsou uložená jen v tomto zařízení (IndexedDB).
   ========================================================= */

// ---------- helpers ----------
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const pad = n => String(n).padStart(2, '0');
const toISO = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const today = () => toISO(new Date());
const parseISO = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const fmtDate = s => s ? parseISO(s).toLocaleDateString('cs-CZ') : '—';
const daysUntil = s => Math.round((parseISO(s) - parseISO(today())) / 86400000);
const MONTHS = ['leden','únor','březen','duben','květen','červen','červenec','srpen','září','říjen','listopad','prosinec'];
const money = (a, c) => (a === '' || a == null) ? '—' : Number(a).toLocaleString('cs-CZ', {maximumFractionDigits: 2}) + ' ' + (c || '');
const fmtSize = b => b > 1e6 ? (b / 1e6).toFixed(1) + ' MB' : Math.max(1, Math.round(b / 1e3)) + ' kB';
function relDays(s) {
  const n = daysUntil(s);
  if (n === 0) return 'dnes';
  if (n === 1) return 'zítra';
  if (n === -1) return 'včera';
  if (n < 0) return `před ${-n} dny`;
  return `za ${n} dní`;
}
function b64FromBytes(u8) { let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); }
function bytesFromB64(b) { const s = atob(b); const u = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return u; }
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2200); }
function download(name, blob) { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); }

// ---------- IndexedDB ----------
const DB = {
  db: null,
  open() {
    return new Promise((res, rej) => {
      const r = indexedDB.open('zeus-offshore', 1);
      r.onupgradeneeded = () => { const db = r.result; db.createObjectStore('kv'); db.createObjectStore('files'); };
      r.onsuccess = () => { this.db = r.result; res(); };
      r.onerror = () => rej(r.error);
    });
  },
  tx(store, mode, fn) {
    return new Promise((res, rej) => {
      const t = this.db.transaction(store, mode); const s = t.objectStore(store);
      const req = fn(s); t.oncomplete = () => res(req && req.result); t.onerror = () => rej(t.error);
    });
  },
  get(store, key) { return this.tx(store, 'readonly', s => s.get(key)); },
  put(store, key, val) { return this.tx(store, 'readwrite', s => s.put(val, key)); },
  del(store, key) { return this.tx(store, 'readwrite', s => s.delete(key)); },
  clear(store) { return this.tx(store, 'readwrite', s => s.clear()); },
};

// ---------- knihovna jurisdikcí (výchozí šablony) ----------
// Pomocníci pro opakující se kroky a dokumenty
const stepsBase = (reg, extra = []) => [
  {id:'s1', title:'Konzultace s klientem a nabídka odeslána', info:'Domluvit strukturu (vlastníci, ředitelé, beneficienti), návrh názvu, cenu a termín.'},
  {id:'s2', title:'Platba / záloha od klienta přijata', info:'Zkontrolujte v záložce Platby, že je platba označená jako „Zaplaceno“.', check:'payment'},
  {id:'s3', title:'Všechny dokumenty od klienta jsou kompletní', info:'Záložka Dokumenty – všechny povinné dokumenty musí být „Schváleno“.', check:'docs'},
  {id:'s4', title:'KYC / due diligence schválena registrovaným agentem', info:'Agent v jurisdikci musí klienta schválit dřív, než firmu založí. Kontrola sankčních seznamů a PEP.'},
  ...reg, ...extra,
  {id:'s98', title:'Bankovní / platební účet otevřen', info:'Podle potřeb klienta (banka, EMI, platební instituce).'},
  {id:'s99', title:'Vše předáno klientovi', info:'Klient dostal kompletní balík dokumentů (originály / apostilované kopie) a přístupy.'}
];
const kyc = (o = {}) => [
  {id:'d1', title:'Cestovní pas', info:'Ověřená kopie (notář), barevná a čitelná, pas platný ještě min. 6 měsíců.', required:true, certified:true, apostille:true, translation:false},
  {id:'d2', title:'Doklad o adrese bydliště', info:'Výpis z banky nebo faktura za energie / internet, ne starší 3 měsíců, se jménem a adresou klienta.', required:true, certified:true, apostille:true, translation:true},
  {id:'d3', title:'Druhý doklad totožnosti (OP nebo řidičák)', info:'Kopie obou stran.', required:false, certified:false, apostille:false, translation:false},
  {id:'d4', title:'Vyplněný a podepsaný dotazník klienta (KYC)', info:'Osobní údaje, činnost, původ peněz.', required:true, certified:false, apostille:false, translation:false},
  {id:'d7', title:'Prohlášení o původu prostředků / majetku (Source of Funds / Wealth)', info:'Odkud peníze pocházejí (podnikání, mzda, prodej majetku…), ideálně s doklady.', required:!!o.sow, certified:false, apostille:false, translation:true},
  {id:'d8', title:'Bankovní reference', info:'Dopis z banky, že je klient jejím klientem v dobrém postavení (obvykle ne starší 3 měsíců), v angličtině.', required:!!o.bankref, certified:false, apostille:false, translation:true},
  {id:'d10', title:'Profesní reference (advokát / účetní)', info:'Dopis od advokáta nebo účetního, který klienta zná min. 2 roky, v angličtině.', required:!!o.proref, certified:false, apostille:false, translation:true},
  {id:'d11', title:'Životopis (CV)', info:'Krátký profesní životopis v angličtině.', required:!!o.cv, certified:false, apostille:false, translation:false},
  ...(o.extra || [])
];
const D_NAMES = {id:'d5', title:'3 návrhy názvu', info:'Seřazené podle priority.', required:true, certified:false, apostille:false, translation:false};

// ---------- password / lock ----------
async function hashPw(pw, saltB64) {
  const enc = new TextEncoder();
  const key = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits({name: 'PBKDF2', salt: bytesFromB64(saltB64), iterations: 150000, hash: 'SHA-256'}, key, 256);
  return b64FromBytes(new Uint8Array(bits));
}

// ---------- deadlines engine ----------
function occurrences(fromISO, toISO_) {
  const from = parseISO(fromISO), to = parseISO(toISO_), out = [];
  for (const co of state.companies) {
    if (!co.formedDate || co.status === 'closed') continue;
    const c = country(co.countryId); if (!c) continue;
    const f = parseISO(co.formedDate), cl = client(co.clientId);
    for (const dl of c.deadlines || []) {
      for (let y = from.getFullYear(); y <= to.getFullYear(); y++) {
        if (y <= f.getFullYear()) continue;
        let d;
        const anniv = new Date(y, f.getMonth(), Math.min(f.getDate(), new Date(y, f.getMonth() + 1, 0).getDate()));
        if (dl.rule === 'anniv_month_first') d = new Date(y, f.getMonth(), 1);
        else if (dl.rule === 'anniv') d = anniv;
        else if (dl.rule === 'anniv_offset') { d = new Date(anniv); d.setDate(d.getDate() + Number(dl.offset || 0)); }
        else if (dl.rule === 'by_half' && f.getMonth() >= 6) d = new Date(y, (dl.month2 || 1) - 1, dl.day2 || 1);
        else d = new Date(y, (dl.month || 1) - 1, dl.day || 1);
        if (d < from || d > to || (co.trackFrom && toISO(d) < co.trackFrom)) continue;
        const key = `${co.id}|${dl.id}|${y}`;
        out.push({key, kind: 'dl', date: toISO(d), title: dl.title, info: dl.info, remind: dl.remind || 30,
          companyId: co.id, clientId: co.clientId, who: (co.name || 'Firma bez názvu') + (cl ? ' · ' + cl.name : ''), done: state.done[key] || null});
      }
    }
  }
  for (const t of state.tasks) {
    if (t.date < fromISO || t.date > toISO_) continue;
    const co = company(t.companyId), cl = client(t.clientId || co?.clientId);
    out.push({key: 't|' + t.id, kind: 'task', taskId: t.id, date: t.date, title: t.title, info: t.note, remind: 7,
      companyId: t.companyId, clientId: t.clientId || co?.clientId,
      who: [co?.name, cl?.name].filter(Boolean).join(' · '), done: t.done || null});
  }
  return out.sort((a, b) => a.date.localeCompare(b.date));
}
function addDays(iso, n) { const d = parseISO(iso); d.setDate(d.getDate() + n); return toISO(d); }
function urgent() { // nesplněné: po termínu (do 1 roku zpět) + do 60 dní
  return occurrences(addDays(today(), -365), addDays(today(), 60)).filter(o => !o.done);
}
function setDone(key, val) {
  if (key.startsWith('t|')) { const t = state.tasks.find(t => t.id === key.slice(2)); if (t) touch(t).done = val; }
  else if (val) state.done[key] = val; else delete state.done[key];
}

// ---------- company progress ----------
function docStatus(co, d) { return (co.docs && co.docs[d.id] && co.docs[d.id].status) || 'missing'; }
function coProgress(co) {
  const c = country(co.countryId); const steps = c ? c.steps : [];
  const done = steps.filter(s => co.steps && co.steps[s.id]).length;
  const next = steps.find(s => !(co.steps && co.steps[s.id]));
  return {done, total: steps.length, next, pct: steps.length ? Math.round(done / steps.length * 100) : 0};
}
function missingDocs(co) { const c = country(co.countryId); return c ? c.docs.filter(d => d.required && docStatus(co, d) !== 'ok') : []; }
function docTags(d) {
  return (d.required ? '<span class="tag rq">povinné</span>' : '') +
    (d.certified ? '<span class="tag ce">ověřená kopie</span>' : '') +
    (d.apostille ? '<span class="tag ap">apostila</span>' : '') +
    (d.translation ? '<span class="tag tr">překlad do EN</span>' : '');
}

function viewCalendar(r) {
  const [y, m] = (r.a || today().slice(0, 7)).split('-').map(Number);
  const first = new Date(y, m - 1, 1); const startOff = (first.getDay() + 6) % 7;
  const start = new Date(y, m - 1, 1 - startOff);
  const end = new Date(start); end.setDate(end.getDate() + 41);
  const occ = occurrences(toISO(start), toISO(end));
  const pays = state.payments.filter(p => p.status !== 'paid' && p.due && p.due >= toISO(start) && p.due <= toISO(end));
  const sel = viewCalendar.sel && viewCalendar.sel.startsWith(`${y}-${pad(m)}`) ? viewCalendar.sel : null;
  const prev = toISO(new Date(y, m - 2, 1)).slice(0, 7), next = toISO(new Date(y, m, 1)).slice(0, 7);
  let cells = '';
  for (let i = 0; i < 42; i++) {
    const d = new Date(start); d.setDate(d.getDate() + i); const iso = toISO(d);
    const evs = occ.filter(o => o.date === iso), ps = pays.filter(p => p.due === iso);
    cells += `<div class="day ${d.getMonth() !== m - 1 ? 'out' : ''} ${iso === today() ? 'today' : ''} ${iso === sel ? 'sel' : ''}" data-act="calday" data-d="${iso}">
      <div class="dn">${d.getDate()}</div>${evs.map(o => `<div class="ev ${o.done ? 'done' : 'dl'}">${esc(o.title)}</div>`).join('')}
      ${ps.map(p => `<div class="ev pay">💳 ${esc(client(p.clientId)?.name || '')}</div>`).join('')}</div>`;
  }
  const listFrom = sel || toISO(first), listTo = sel || toISO(new Date(y, m, 0));
  const listOcc = occ.filter(o => o.date >= listFrom && o.date <= listTo);
  const listPay = pays.filter(p => p.due >= listFrom && p.due <= listTo);
  return `<div class="head"><div class="grow"><h1>Kalendář</h1><p class="sub" style="margin:0">Termíny podání a splatnosti plateb</p></div>
    <button class="btn" data-act="newtask">＋ Vlastní termín</button>
    <button class="btn gold" data-act="ics">📲 Export do kalendáře Mac/iPad</button></div>
    <div class="row" style="margin-bottom:12px"><a class="btn" href="#/kalendar/${prev}">‹</a><h2 style="margin:0;min-width:170px;text-align:center;text-transform:capitalize">${MONTHS[m - 1]} ${y}</h2><a class="btn" href="#/kalendar/${next}">›</a>
      <a class="btn small" href="#/kalendar/${today().slice(0, 7)}">Dnes</a></div>
    <div class="cal">${['Po', 'Út', 'St', 'Čt', 'Pá', 'So', 'Ne'].map(x => `<div class="dh">${x}</div>`).join('')}${cells}</div>
    <div class="card" style="margin-top:16px"><div class="row" style="margin-bottom:6px"><h2 style="margin:0">${sel ? fmtDate(sel) : 'Celý měsíc'}</h2>${sel ? '<button class="btn small right" data-act="calday" data-d="">Zobrazit celý měsíc</button>' : ''}</div>
      <div class="list">${listOcc.map(o => deadlineRow(o)).join('')}${listPay.map(p => payRow(p)).join('')}${!listOcc.length && !listPay.length ? '<div class="empty">Nic naplánováno.</div>' : ''}</div></div>`;
}

function collectDraft() {
  const root = $('#ced'); if (!root || !draft) return;
  root.querySelectorAll('[data-root]').forEach(el => draft[el.dataset.root] = el.value.trim());
  root.querySelectorAll('.editor-item').forEach(it => {
    const o = draft[it.dataset.list][Number(it.dataset.i)];
    it.querySelectorAll('[data-f]').forEach(el => {
      const k = el.dataset.f;
      if (el.type === 'checkbox') o[k] = el.checked;
      else if (el.type === 'number') o[k] = el.value === '' ? undefined : Number(el.value);
      else o[k] = el.value.trim();
    });
  });
}
function bindCountryEditor() {
  $('#main').onclick = async e => {
    const b = e.target.closest('[data-ed]'); if (!b) return;
    e.preventDefault(); collectDraft();
    const L = b.dataset.list, i = Number(b.dataset.i), arr = L && draft[L];
    switch (b.dataset.ed) {
      case 'add': arr.push(L === 'steps' ? {id: uid(), title: '', info: ''} : L === 'docs' ? {id: uid(), title: '', info: '', required: true} : {id: uid(), title: '', info: '', rule: 'anniv_month_first', remind: 30}); break;
      case 'del': if (!confirm('Odebrat tuto položku?')) return; arr.splice(i, 1); break;
      case 'up': if (i > 0) [arr[i - 1], arr[i]] = [arr[i], arr[i - 1]]; break;
      case 'down': if (i < arr.length - 1) [arr[i + 1], arr[i]] = [arr[i], arr[i + 1]]; break;
      case 'save': {
        if (!draft.name) return alert('Vyplňte název země.');
        for (const L2 of ['steps', 'docs', 'deadlines']) draft[L2] = draft[L2].filter(x => x.title);
        for (const t of draft.deadlines) {
          if ((t.rule === 'yearly' || t.rule === 'by_half') && !(t.day && t.month)) return alert(`U termínu „${t.title}“ vyplňte den a měsíc.`);
          if (t.rule === 'by_half' && !(t.day2 && t.month2)) return alert(`U termínu „${t.title}“ vyplňte den a měsíc pro firmy založené ve 2. pololetí.`);
        }
        const idx = state.countries.findIndex(c => c.id === draft.id);
        state.countries[idx] = touch(draft); draft = null;
        location.hash = '#/nastaveni'; await commit('Uloženo ✔'); return;
      }
      case 'delcountry': {
        const used = state.companies.filter(c => c.countryId === draft.id).length;
        if (used) return alert(`Tuto zemi používá ${used} firem – nejdřív je smažte nebo přesuňte.`);
        if (!confirm('Opravdu smazat zemi?')) return;
        state.countries = state.countries.filter(c => c.id !== draft.id);
        if (DEFAULT_COUNTRIES.some(l => l.id === draft.id)) (state.settings.removedLib = state.settings.removedLib || []).push(draft.id);
        draft = null;
        location.hash = '#/nastaveni'; await commit('Smazáno'); return;
      }
    }
    const y = scrollY; $('#main').innerHTML = viewCountry(route()); scrollTo(0, y);
  };
}

function modal(title, body, onSubmit, {submit = 'Uložit', wide = false} = {}) {
  const root = $('#modal-root');
  root.innerHTML = `<div class="back"><form class="modal ${wide ? 'wide' : ''}" novalidate><div class="mh"><h2>${title}</h2><button type="button" class="btn ghost" data-close>✕</button></div>
    <div class="mb">${body}</div><div class="mf"><button type="button" class="btn" data-close>Zrušit</button><button class="btn primary">${submit}</button></div></form></div>`;
  const form = root.querySelector('form');
  root.querySelectorAll('[data-close]').forEach(b => b.onclick = () => root.innerHTML = '');
  form.onsubmit = async e => {
    e.preventDefault();
    if (!form.checkValidity()) { form.reportValidity(); return; }
    const data = Object.fromEntries(new FormData(form).entries());
    form.querySelectorAll('input[type=checkbox]').forEach(c => data[c.name] = c.checked);
    const r = await onSubmit(data, form);
    if (r !== false) root.innerHTML = '';
  };
  const first = form.querySelector('input:not([type=hidden]),select,textarea'); if (first) setTimeout(() => first.focus(), 50);
  return form;
}

const inp = (name, v = '', a = '') => `<input name="${name}" value="${esc(v)}" ${a}>`;
const opt = (pairs, sel) => pairs.map(([v, l]) => `<option value="${esc(v)}" ${String(v) === String(sel) ? 'selected' : ''}>${esc(l)}</option>`).join('');

// ---------- files ----------
async function uploadFiles(input) {
  const {client: clientId, company: companyId, doc: docId} = input.dataset;
  const files = [...input.files]; if (!files.length) return;
  for (const f of files) {
    if (f.size > 50e6) { alert(`Soubor ${f.name} je větší než 50 MB.`); continue; }
    const id = uid();
    await DB.put('files', id, f);
    state.files.push(touch({id, clientId, companyId: companyId || null, docId: docId || null, name: f.name, type: f.type, size: f.size, added: today()}));
  }
  if (docId) { const co = company(companyId); co.docs = co.docs || {}; const cur = co.docs[docId]?.status; if (!cur || cur === 'missing') { co.docs[docId] = {status: 'received'}; touch(co); } }
  await commit(files.length > 1 ? `Nahráno ${files.length} souborů` : 'Soubor nahrán');
}
async function openFile(id) {
  const meta = state.files.find(f => f.id === id); const blob = await DB.get('files', id);
  if (!blob) return alert('Soubor v tomto zařízení není (možná byl obnoven ze zálohy bez souborů).');
  const url = URL.createObjectURL(blob);
  const w = window.open(url, '_blank');
  if (!w) download(meta?.name || 'soubor', blob);
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}
async function deleteFilesWhere(pred) {
  const del = state.files.filter(pred);
  for (const f of del) await DB.del('files', f.id);
  state.files = state.files.filter(f => !pred(f));
}

// ---------- ICS export ----------
function icsEscape(s) { return String(s || '').replace(/\\/g, '\\\\').replace(/\n/g, '\\n').replace(/[,;]/g, m => '\\' + m); }
function icsFold(line) { const out = []; let s = line; while (s.length > 73) { out.push(s.slice(0, 73)); s = ' ' + s.slice(73); } out.push(s); return out.join('\r\n'); }
function exportICS() {
  const from = addDays(today(), -30), to = addDays(today(), 730);
  const occ = occurrences(from, to).filter(o => !o.done);
  const stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+/, '');
  const L = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//ZEUS Offshore//CS', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH', 'X-WR-CALNAME:ZEUS Offshore'];
  const ev = (uidv, date, summary, desc, remind) => {
    const d = date.replace(/-/g, ''), d2 = addDays(date, 1).replace(/-/g, '');
    L.push('BEGIN:VEVENT', 'UID:' + uidv + '@zeus-offshore', 'DTSTAMP:' + stamp, 'DTSTART;VALUE=DATE:' + d, 'DTEND;VALUE=DATE:' + d2,
      'SUMMARY:' + icsEscape(summary), 'DESCRIPTION:' + icsEscape(desc), 'TRANSP:TRANSPARENT');
    for (const r of [remind, 1].filter((v, i, a) => v > 0 && a.indexOf(v) === i))
      L.push('BEGIN:VALARM', 'ACTION:DISPLAY', 'DESCRIPTION:' + icsEscape(summary), `TRIGGER:-P${r}D`, 'END:VALARM');
    L.push('END:VEVENT');
  };
  for (const o of occ) ev(o.key.replace(/\|/g, '-'), o.date, `⚡ ${o.title}${o.who ? ' – ' + o.who : ''}`, o.info || '', o.remind);
  for (const p of state.payments.filter(p => p.status !== 'paid' && p.due && p.due >= from))
    ev('pay-' + p.id, p.due, `💳 Platba: ${client(p.clientId)?.name || ''} – ${p.title}`, `${money(p.amount, p.currency)}\n${p.note || ''}`, 3);
  L.push('END:VCALENDAR');
  download(`ZEUS-Offshore-kalendar-${today()}.ics`, new Blob([L.map(icsFold).join('\r\n')], {type: 'text/calendar'}));
  modal('Export do kalendáře', `<p>Soubor <b>.ics</b> se stáhl (${occ.length} termínů + nezaplacené platby, s upozorněním předem).</p>
    <p><b>Mac:</b> otevřete stažený soubor dvojklikem → Kalendář se zeptá, do kterého kalendáře ho přidat. Doporučujeme si v Kalendáři nejdřív vytvořit nový kalendář „ZEUS Offshore“.</p>
    <p><b>iPad:</b> klepněte na stažený soubor ve Stažených → „Přidat vše“.</p>
    <p class="muted small">Když přibudou noví klienti, export zopakujte. Aby se termíny neduplikovaly, před novým importem v Kalendáři smažte kalendář „ZEUS Offshore“ a vytvořte ho znovu – nebo importujte jen do prázdného kalendáře.</p>`, () => {}, {submit: 'Rozumím'});
}

// ---------- backup ----------
async function exportBackup(withFiles) {
  toast('Připravuji zálohu…');
  const files = [];
  if (withFiles) for (const f of state.files) { const b = await DB.get('files', f.id); if (b) files.push({id: f.id, data: b64FromBytes(new Uint8Array(await b.arrayBuffer()))}); }
  const payload = {app: 'zeus-offshore', version: 1, exported: new Date().toISOString(), withFiles, state, files};
  download(`ZEUS-Offshore-zaloha-${today()}${withFiles ? '' : '-bez-souboru'}.json`, new Blob([JSON.stringify(payload)], {type: 'application/json'}));
  state.settings.lastBackup = Date.now(); await commit('Záloha stažena ✔');
}
function mergeById(local, incoming) {
  const map = new Map(local.map(x => [x.id, x]));
  for (const x of incoming) { const l = map.get(x.id); if (!l || (x.updated || 0) > (l.updated || 0)) map.set(x.id, x); }
  return [...map.values()];
}
async function importBackup(file) {
  let data;
  try { data = JSON.parse(await file.text()); } catch { return alert('Tento soubor není záloha ZEUS Offshore.'); }
  if (data.app !== 'zeus-offshore' || !data.state) return alert('Tento soubor není záloha ZEUS Offshore.');
  const s = data.state;
  modal('Nahrát zálohu', `<p>Záloha z <b>${new Date(data.exported).toLocaleString('cs-CZ')}</b>: ${s.clients.length} klientů, ${s.companies.length} firem, ${s.payments.length} plateb${data.withFiles ? `, ${data.files.length} souborů` : ' (bez souborů)'}.</p>
    <label class="check" style="margin-bottom:10px"><input type="radio" name="mode" value="merge" checked> <span><b>Sloučit</b> – přidá nové a aktualizuje změněné záznamy. Nic se nesmaže. <i>(doporučeno)</i></span></label>
    <label class="check"><input type="radio" name="mode" value="replace"> <span><b>Nahradit vše</b> – smaže data v tomto zařízení a nahraje zálohu.</span></label>`, async d => {
    if (d.mode === 'replace') {
      if (!confirm('Opravdu SMAZAT data v tomto zařízení a nahradit je zálohou?')) return false;
      await DB.clear('files'); const settings = state.settings; state = s; state.settings = {...settings, ...{lockMinutes: settings.lockMinutes}};
    } else {
      for (const k of ['clients', 'companies', 'payments', 'tasks', 'files', 'countries']) state[k] = mergeById(state[k] || [], s[k] || []);
      state.done = {...(s.done || {}), ...state.done};
    }
    for (const f of data.files || []) await DB.put('files', f.id, new Blob([bytesFromB64(f.data)], {type: (s.files.find(x => x.id === f.id) || {}).type || ''}));
    await commit('Záloha nahrána ✔');
  }, {submit: 'Nahrát'});
}

      F('Datum', inp('date', viewCalendar.sel || today(), 'type="date" required'), '', true) +
      F('Firma (nepovinné)', `<select name="companyId">${opt([['', '— žádná —'], ...cos], co || '')}</select>`) + F('Poznámka', `<textarea name="note"></textarea>`), async d => {
      state.tasks.push(touch({id: uid(), title: d.title, date: d.date, note: d.note, companyId: d.companyId || null, clientId: company(d.companyId)?.clientId || null, done: null}));
      await commit('Termín přidán ✔');
    });
  },
  calday: ({d}) => { viewCalendar.sel = d || null; render(); },
  ics: () => exportICS(),
  openfile: ({id}) => openFile(id),
  delfile: async ({id}) => { const f = state.files.find(x => x.id === id); if (!confirm(`Smazat soubor ${f?.name}?`)) return; await deleteFilesWhere(x => x.id === id); await commit('Soubor smazán'); },
  export: ({files}) => exportBackup(files === '1'),
  newcountry: () => modal('Přidat jurisdikci', F('Název země / jurisdikce', inp('name', '', 'required placeholder="např. Delaware (USA), BVI, Dubaj…"'), '', true) +
    `<div class="f2">${F('Typ (firma / nadace / trust)', inp('entity', 'LLC'))}${F('Vlajka (emoji)', inp('flag', '🏳️'))}</div>` +
    F('Začít z', `<select name="from">${opt([['', 'Prázdné šablony'], ...state.countries.map(c => [c.id, 'Kopie: ' + c.name])], '')}</select>`, 'Kopie se hodí, když je postup podobný – pak jen upravíte rozdíly.'), async d => {
    const src = country(d.from);
    const c = touch({id: uid(), name: d.name.trim(), entity: d.entity, flag: d.flag, about: src ? src.about : '',
      steps: src ? src.steps.map(s => ({...s, id: uid()})) : [], docs: src ? src.docs.map(s => ({...s, id: uid()})) : [], deadlines: src ? src.deadlines.map(s => ({...s, id: uid()})) : []});
    state.countries.push(c); draft = null; location.hash = '#/zeme/' + c.id; await commit('Přidáno – teď upravte šablony');
  }),
  cancelcountry: () => { draft = null; },
  changepw: () => modal('Změnit heslo', F('Současné heslo', '<input type="password" name="old" required>') + F('Nové heslo', '<input type="password" name="p1" required minlength="6">', 'Minimálně 6 znaků') + F('Nové heslo znovu', '<input type="password" name="p2" required>'), async d => {
    const auth = await DB.get('kv', 'auth');
    if (await hashPw(d.old, auth.salt) !== auth.hash) return alert('Současné heslo nesedí.'), false;
    if (d.p1 !== d.p2) return alert('Nová hesla se neshodují.'), false;
    const salt = b64FromBytes(crypto.getRandomValues(new Uint8Array(16)));
    await DB.put('kv', 'auth', {salt, hash: await hashPw(d.p1, salt)}); toast('Heslo změněno ✔');
  }),
  wipe: async () => {
    const t = prompt('Smaže VŠECHNA data v tomto zařízení (klienty, dokumenty, heslo). Udělejte si nejdřív zálohu!\n\nPro potvrzení napište: SMAZAT');
    if (t !== 'SMAZAT') return;
    await DB.clear('kv'); await DB.clear('files'); location.hash = '#/'; location.reload();
  },
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || !unlocked) return;
  if (el.tagName === 'A' && el.dataset.act !== 'cancelcountry') e.preventDefault();
  const fn = actions[el.dataset.act]; if (fn) fn(el.dataset, el);
});
document.addEventListener('change', e => {
  if (!unlocked) return;
  if (e.target.matches('[data-upload]')) uploadFiles(e.target).finally(() => e.target.value = '');
  if (e.target.id === 'importfile') { const f = e.target.files[0]; e.target.value = ''; if (f) importBackup(f); }
  if (e.target.id === 'lockmin') { state.settings.lockMinutes = Number(e.target.value); save(); toast('Uloženo ✔'); }
});
document.addEventListener('input', e => {
  if (e.target.id === 'q') { viewClients.q = e.target.value; const pos = e.target.selectionStart; render(); const q = $('#q'); q.focus(); q.setSelectionRange(pos, pos); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') $('#modal-root').innerHTML = ''; });

// ---------- start ----------
(async () => {
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
  try { await DB.open(); } catch (e) { document.body.innerHTML = '<p style="padding:30px">Tento prohlížeč neumožňuje ukládat data (možná je zapnuté soukromé okno). Otevřete aplikaci v normálním okně Safari / Chrome.</p>'; return; }
  showLock();
})();
</script>
</body>
</html>
